# Agent Orchestrator — self-hosting config (dog-fooding)

dataDir: ~/.ao-sessions
worktreeDir: ~/.worktrees/ao

defaults:
  runtime: tmux
  agent: codex              # uses OPENAI_API_KEY (no Anthropic key needed)
  workspace: worktree
  notifiers: [desktop]

projects:
  ao:
    name: Agent Orchestrator
    repo: ComposioHQ/agent-orchestrator
    path: ~/agent-orchestrator
    defaultBranch: main
    sessionPrefix: ao
    scm:
      plugin: github
    tracker:
      plugin: linear
      teamId: "2a6e9b1b-19cd-4e30-b5bd-7b34dc491c7e"
    symlinks: [.claude]
    postCreate:
      - "pnpm install"
    agentConfig:
      permissions: skip

  # clasper-core — AO builds this repo (agents work on issues here)
  clasper-core:
    name: Clasper Core
    repo: AppLetico/clasper-core
    path: ~/workspace/clasper-core
    defaultBranch: main
    sessionPrefix: clasper
    scm:
      plugin: github
    tracker:
      plugin: github
    symlinks: [.claude]
    postCreate:
      - "npm install"
    agentConfig:
      permissions: skip
